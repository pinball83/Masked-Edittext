apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jetbrains.kotlinx.kover'

version = '2.2.0'

android {
    compileSdkVersion 36
    buildToolsVersion "35.0.0"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 36

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    
    buildFeatures {
        compose true
    }
    
    composeOptions {
        kotlinCompilerExtensionVersion compose_compiler_version
    }
    
    kotlinOptions {
        jvmTarget = '21'
    }

    testOptions {
        unitTests.all {
            // Разрешаем доступ к internal классам JDK 21
            jvmArgs += [
                    "--add-opens", "java.base/jdk.internal.reflect=ALL-UNNAMED"
            ]
            // (по желанию) более информативные логи при падениях
            testLogging {
                events "passed", "skipped", "failed"
            }
        }
    }

//    testOptions {
//        unitTests.all {
//            jacoco.includeNoLocationClasses = true
//            jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED',
//                    '--add-opens=java.base/java.nio=ALL-UNNAMED',
//                    '--add-opens=java.base/java.net=ALL-UNNAMED',
//                    '--add-opens=java.base/java.util=ALL-UNNAMED',
//                    '--add-opens=java.base/java.io=ALL-UNNAMED'
//        }
//    }
    
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            // Enable instrumentation coverage for Espresso tests (Android Test Coverage)
            testCoverageEnabled true
        }
    }
    namespace 'com.thrd.maskededittext'
}

// Kover is applied; default reports are available via:
//  - :masked-edittext:koverHtmlReport (unit tests)
//  - :masked-edittext:koverXmlReport
