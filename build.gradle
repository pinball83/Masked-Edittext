// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '2.2.0'
    ext.compose_version = '1.9.2'
    ext.compose_compiler_version = '1.4.3'

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.github.dcendents:android-maven-gradle-plugin:2.1'
        classpath 'org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.2.0'
        classpath 'org.jetbrains.kotlinx:kover-gradle-plugin:0.9.3'
        classpath 'io.github.gradle-nexus:publish-plugin:1.3.0'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

version = (findProperty('VERSION') ?: findProperty('version') ?: '2.2.0').toString()
group = (findProperty('GROUP') ?: 'io.github.pinball83').toString()

apply plugin: 'io.github.gradle-nexus.publish-plugin'

nexusPublishing {
    def localCredentials = new Properties()
    // Local-only file (gitignored) commonly used in this repo for secrets.
    [rootProject.file('signing.properties')].findAll { it.exists() }.each { file ->
        file.withInputStream { localCredentials.load(it) }
    }

    def sonatypeUsername = (findProperty('sonatypeUsername')
            ?: findProperty('mavenCentralUsername')
            ?: localCredentials.getProperty('sonatypeUsername')
            ?: localCredentials.getProperty('mavenCentralUsername')
            ?: System.getenv('OSSRH_USERNAME')
            ?: System.getenv('SONATYPE_USERNAME'))?.toString()
    def sonatypePassword = (findProperty('sonatypePassword')
            ?: findProperty('mavenCentralPassword')
            ?: localCredentials.getProperty('sonatypePassword')
            ?: localCredentials.getProperty('mavenCentralPassword')
            ?: System.getenv('OSSRH_PASSWORD')
            ?: System.getenv('SONATYPE_PASSWORD'))?.toString()

    repositories {
        sonatype {
            nexusUrl = uri("https://ossrh-staging-api.central.sonatype.com/service/local/")
            snapshotRepositoryUrl = uri("https://central.sonatype.com/repository/maven-snapshots/")

            // These must be a Sonatype "User Token" (not your account password).
            // Provide via `-PsonatypeUsername/-PsonatypePassword` or `~/.gradle/gradle.properties`.
            username = sonatypeUsername
            password = sonatypePassword
        }
    }
}
