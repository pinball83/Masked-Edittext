name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-cover:
    name: Lint, Test, Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}
            ~/.android
          key: ${{ runner.os }}-android-sdk-36-buildtools-35-0-0
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses and install packages
        shell: bash
        run: |
          sdkmanager --licenses <<<'y\ny\ny\ny\ny' > /dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle
        run: ./gradlew --version

      - name: Lint
        run: ./gradlew --stacktrace --build-cache lint

      - name: Collect lint reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lint-summary
          report_paths=$(find . -type f -path "*/build/intermediates/lint_intermediate_text_report/*/lintReport*/lint-results-*.txt")
          if [[ -z "$report_paths" ]]; then
            echo "## Lint summary" > lint-summary/summary.md
            echo "" >> lint-summary/summary.md
            echo "- No lint reports found." >> lint-summary/summary.md
            exit 0
          fi
          python3 - << 'PY'
          import os
          import pathlib
          import re
          reports = [
              pathlib.Path(path)
              for path in os.popen(
                  "find . -type f -path "
                  "'*/build/intermediates/lint_intermediate_text_report/*/lintReport*/lint-results-*.txt'"
              ).read().splitlines()
              if path
          ]
          def module_name(path: pathlib.Path) -> str:
              parts = list(path.parts)
              if "build" in parts:
                  idx = parts.index("build")
                  if idx > 0:
                      return parts[idx - 1]
              return path.parent.name
          lines = ["## Lint summary", ""]
          for report in sorted(reports):
              text = report.read_text(errors="ignore")
              summary = re.search(r"(\d+)\s+errors?,\s+(\d+)\s+warnings?", text, re.IGNORECASE)
              if not summary:
                  summary = re.search(r"Lint found\s+(\d+)\s+errors?\s+and\s+(\d+)\s+warnings?", text, re.IGNORECASE)
              if summary:
                  errors = int(summary.group(1))
                  warnings = int(summary.group(2))
                  lines.append(f"- {module_name(report)}: {errors} error(s), {warnings} warning(s)")
              else:
                  errors_matches = re.findall(r"(\d+)\s+errors?", text, re.IGNORECASE)
                  warnings_matches = re.findall(r"(\d+)\s+warnings?", text, re.IGNORECASE)
                  if errors_matches and warnings_matches:
                      errors = int(errors_matches[-1])
                      warnings = int(warnings_matches[-1])
                      lines.append(f"- {module_name(report)}: {errors} error(s), {warnings} warning(s)")
                  elif not text.strip():
                      lines.append(f"- {module_name(report)}: 0 error(s), 0 warning(s)")
                  else:
                      lines.append(f"- {module_name(report)}: summary unavailable (`{report}`)")
          lines.append("")
          lines.append("Full reports are available in the lint artifact.")
          pathlib.Path("lint-summary/summary.md").write_text("\\n".join(lines))
          PY
          while IFS= read -r path; do
            cp --parents "$path" lint-summary/
          done <<< "$report_paths"

      - name: Publish lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: lint-summary/**

      - name: Comment lint summary on PR
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-file: lint-summary/summary.md
          comment-identifier: lint-summary

      - name: Unit tests (all modules)
        run: ./gradlew --stacktrace --build-cache test

      - name: Coverage (Kover) for library module
        run: |
          ./gradlew --stacktrace --build-cache :masked-edittext:koverXmlReport :masked-edittext:koverHtmlReport

      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**

      - name: Publish coverage reports (Kover)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-kover
          path: |
            masked-edittext/build/reports/kover/**

      - name: Coverage summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          SUMMARY_FILE="${GITHUB_STEP_SUMMARY:-/dev/stdout}"
          report_candidates=(
            "masked-edittext/build/reports/kover/xml/report.xml"
            "masked-edittext/build/reports/kover/report.xml"
            "masked-edittext/build/reports/kover/xmlDebug/report.xml"
            "masked-edittext/build/reports/kover/xmlRelease/report.xml"
          )
          REPORT_XML=""
          for candidate in "${report_candidates[@]}"; do
            if [[ -f "$candidate" ]]; then
              REPORT_XML="$candidate"
              break
            fi
          done
          if [[ -n "$REPORT_XML" ]]; then
            REPORT_XML="$REPORT_XML" python3 - << 'PY'
          import xml.etree.ElementTree as ET
          import os
          import sys
          path = os.environ["REPORT_XML"]
          try:
              tree = ET.parse(path)
          except Exception as exc:
              print(f"Failed to parse coverage report at {path}: {exc}")
              sys.exit(0)
          root = tree.getroot()
          line = next((c for c in root.findall('counter') if c.get('type')=='LINE'), None)
          inst = next((c for c in root.findall('counter') if c.get('type')=='INSTRUCTION'), None)
          def pct(counter):
              if counter is None: return None
              missed = int(counter.get('missed', '0'))
              covered = int(counter.get('covered', '0'))
              total = missed + covered
              return (covered * 100.0 / total) if total else 0.0
          lines = pct(line)
          instructions = pct(inst)
          summary = []
          if lines is not None:
              summary.append(f"Line coverage: {lines:.2f}%")
          if instructions is not None:
              summary.append(f"Instruction coverage: {instructions:.2f}%")
          print("\n".join(summary) or f"No coverage counters found in {path}.")
          PY
                    else
                      echo "Coverage report not found. Checked:"
                      printf '%s\n' "${report_candidates[@]}"
                    fi >> "$SUMMARY_FILE"
