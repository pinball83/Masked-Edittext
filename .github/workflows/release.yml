name: Release to Maven Central

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 2.2.1). Overrides tag when set."
        required: false
        type: string

jobs:
  publish:
    name: Publish artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      # Common envs many Gradle configs consume for Sonatype + Signing
      OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
      OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
      SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      # Also expose via ORG_GRADLE_PROJECT_* so Gradle can read without extra wiring
      ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.OSSRH_USERNAME }}
      ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.OSSRH_PASSWORD }}
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}
      ORG_GRADLE_PROJECT_signingKeyId: ${{ secrets.SIGNING_KEY_ID }}
      ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}
            ~/.android
          key: ${{ runner.os }}-android-sdk-36-buildtools-35-0-0
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses and install packages
        shell: bash
        run: |
          sdkmanager --licenses <<<'y\ny\ny\ny\ny' > /dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set release version from tag
        shell: bash
        run: |
          set -euo pipefail
          version_input="${{ inputs.version }}"
          if [[ -n "$version_input" ]]; then
            echo "Using workflow_dispatch version ${version_input}"
            echo "ORG_GRADLE_PROJECT_VERSION=${version_input}" >> "$GITHUB_ENV"
            exit 0
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "No version input provided for manual release; refusing to continue."
            exit 1
          fi

          ref="${GITHUB_REF_NAME}"
          if [[ "$ref" == v* ]]; then
            version="${ref#v}"
            echo "Using release version ${version}"
            echo "ORG_GRADLE_PROJECT_VERSION=${version}" >> "$GITHUB_ENV"
          else
            echo "GITHUB_REF_NAME '${ref}' does not match a version tag; skipping override."
          fi

      - name: Import GPG key (for signing)
        if: env.SIGNING_KEY != ''
        shell: bash
        run: |
          set -euo pipefail
          echo "Preparing GPG for artifact signing"
          # Try base64 decode first; if it fails, import raw armored key
          tmpkey=$(mktemp)
          if echo "$SIGNING_KEY" | base64 --decode --ignore-garbage > "$tmpkey" 2>/dev/null && grep -q "BEGIN PGP PRIVATE KEY BLOCK" "$tmpkey"; then
            echo "Detected base64-encoded key; importing decoded key"
            gpg --batch --import "$tmpkey"
          else
            echo "Importing key as provided (armored)"
            printf "%s" "$SIGNING_KEY" | gpg --batch --import
          fi
          rm -f "$tmpkey"

      - name: Build release AAR (sanity)
        run: ./gradlew --stacktrace --build-cache :masked-edittext:assembleRelease

      - name: Publish to Sonatype or generic Maven
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking for Nexus Publish tasks..."
          if ./gradlew -q tasks --all | grep -q "publishToSonatype"; then
            echo "Using Gradle Nexus Publish Plugin"
            ./gradlew --stacktrace --build-cache publishToSonatype closeAndReleaseSonatypeStagingRepository
          else
            echo "Falling back to generic 'publish'"
            ./gradlew --stacktrace --build-cache publish
          fi

      - name: Upload built artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            masked-edittext/build/outputs/aar/*.aar
            **/build/publications/**
